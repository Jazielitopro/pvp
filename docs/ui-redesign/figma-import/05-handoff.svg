    <text x="28" y="132" class="label" fill="#70FF97">02  TOUCH TARGETS AT LEAST 44PX</text>
    <text x="28" y="172" class="label" fill="#70FF97">03  EN + ES REPRESENTATIVE COPY FITS</text>
    <text x="28" y="212" class="label" fill="#70FF97">04  CROSSHAIR AREA STAYS QUIET</text>
    <text x="28" y="252" class="label" fill="#FFD854">05  APPROVE FIGMA BEFORE LUAU EDITS</text>
    <text x="28" y="308" class="tiny">AFTER APPROVAL: STUDIO DESKTOP + MOBILE EMULATION</text>
