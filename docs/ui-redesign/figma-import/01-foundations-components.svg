    <text x="24" y="66" class="body">Dark surface, restrained neon border, readable hierarchy.</text>
    <rect x="24" y="94" width="156" height="48" rx="12" fill="#40E6FF"/>
    <text x="58" y="124" class="label" fill="#06080E">PRIMARY ACTION</text>
    <rect x="196" y="94" width="156" height="48" rx="12" fill="#1D243A" stroke="#526996"/>
    <text x="224" y="124" class="label">SECONDARY</text>
    <rect x="24" y="158" width="156" height="40" rx="12" fill="#FFD854"/>
    <text x="60" y="183" class="label" fill="#06080E">CLAIM +100</text>
    <rect x="196" y="158" width="156" height="40" rx="12" fill="#121726" stroke="#526996" stroke-opacity=".45"/>
    <text x="244" y="183" class="label" opacity=".46">DISABLED</text>
  </g>

  <g transform="translate(486 382)">
    <rect class="panel" width="388" height="220" rx="20"/>
