<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06080E"/>
      <stop offset="1" stop-color="#121726"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D243A"/>
      <stop offset="1" stop-color="#0B0E18"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".38"/></filter>
    <style>
      .h1{font:700 34px Arial;fill:#F5F8FF;letter-spacing:2px}
      .h2{font:700 20px Arial;fill:#F5F8FF;letter-spacing:1px}
      .label{font:700 14px Arial;fill:#F5F8FF;letter-spacing:.8px}
      .body{font:500 13px Arial;fill:#9EACC6}
      .tiny{font:700 11px Arial;fill:#9EACC6;letter-spacing:.7px}
      .panel{fill:url(#panel);stroke:#526996;stroke-opacity:.7;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1160" fill="url(#bg)"/>
  <text x="64" y="72" class="h1">PARRYHOOK UI REDESIGN</text>
  <text x="64" y="100" class="body">01 Foundations / 02 Components - Figma import starter board</text>

  <text x="64" y="164" class="h2">COLOR TOKENS</text>
  <g transform="translate(64 190)">
    <g><rect width="112" height="88" rx="14" fill="#06080E" stroke="#526996"/><text x="12" y="112" class="tiny">INK #06080E</text></g>
    <g transform="translate(142)"><rect width="112" height="88" rx="14" fill="#0B0E18" stroke="#526996"/><text x="12" y="112" class="tiny">PANEL</text></g>
    <g transform="translate(284)"><rect width="112" height="88" rx="14" fill="#121726" stroke="#526996"/><text x="12" y="112" class="tiny">SOFT</text></g>
    <g transform="translate(426)"><rect width="112" height="88" rx="14" fill="#1D243A" stroke="#526996"/><text x="12" y="112" class="tiny">LIFT</text></g>
    <g transform="translate(568)"><rect width="112" height="88" rx="14" fill="#40E6FF"/><text x="12" y="112" class="tiny">CYAN</text></g>
    <g transform="translate(710)"><rect width="112" height="88" rx="14" fill="#FFD854"/><text x="12" y="112" class="tiny">GOLD</text></g>
    <g transform="translate(852)"><rect width="112" height="88" rx="14" fill="#FF56AE"/><text x="12" y="112" class="tiny">PINK</text></g>
    <g transform="translate(994)"><rect width="112" height="88" rx="14" fill="#9A65FF"/><text x="12" y="112" class="tiny">VIOLET</text></g>
    <g transform="translate(1136)"><rect width="112" height="88" rx="14" fill="#70FF97"/><text x="12" y="112" class="tiny">GREEN</text></g>
  </g>

  <text x="64" y="356" class="h2">CORE COMPONENTS</text>
  <g transform="translate(64 382)">
    <rect class="panel" width="388" height="220" rx="20" filter="url(#shadow)"/>
