<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111D"/><stop offset=".56" stop-color="#17243B"/><stop offset="1" stop-color="#100B21"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D243A" stop-opacity=".96"/><stop offset="1" stop-color="#0B0E18" stop-opacity=".92"/></linearGradient>
    <radialGradient id="danger"><stop stop-color="#FF525C" stop-opacity="0"/><stop offset="1" stop-color="#FF525C" stop-opacity=".18"/></radialGradient>
    <style>
      .title{font:700 18px Arial;fill:#F5F8FF;letter-spacing:1px}.label{font:700 14px Arial;fill:#F5F8FF;letter-spacing:.7px}.body{font:500 13px Arial;fill:#9EACC6}.tiny{font:700 11px Arial;fill:#9EACC6;letter-spacing:.8px}.panel{fill:url(#panel);stroke:#526996;stroke-opacity:.7;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#arena)"/>
  <path d="M0 640 L340 390 L520 502 L760 300 L1040 480 L1440 222 L1440 900 L0 900Z" fill="#0B1523" opacity=".7"/>
  <path d="M0 738 L420 492 L690 650 L930 462 L1440 626 L1440 900 L0 900Z" fill="#111B2B" opacity=".82"/>
  <rect width="1440" height="900" fill="url(#danger)"/>

  <g transform="translate(494 22)">
    <rect width="452" height="70" rx="20" class="panel"/>
    <text x="24" y="28" class="tiny" fill="#40E6FF">TEAM DEATHMATCH</text>
    <text x="24" y="53" class="body">First team to 25 eliminations</text>
    <rect x="304" y="14" width="126" height="42" rx="16" fill="#121726" stroke="#40E6FF"/>
    <text x="367" y="41" text-anchor="middle" class="title">A 12 - 09 B</text>
  </g>

  <g transform="translate(1180 22)">
    <rect width="236" height="118" rx="18" class="panel"/>
    <text x="18" y="28" class="tiny" fill="#FFD854">CONTRACT</text>
    <text x="18" y="55" class="label">Daily Finisher</text>
    <text x="18" y="77" class="body">Score 8 eliminations</text>
    <rect x="18" y="91" width="162" height="10" rx="5" fill="#06080E"/><rect x="18" y="91" width="121" height="10" rx="5" fill="#FFD854"/>
    <text x="194" y="101" class="tiny">6/8</text>
  </g>

  <g transform="translate(1150 166)">
    <text x="266" y="0" text-anchor="end" class="tiny">KILL FEED</text>
    <rect y="16" width="266" height="36" rx="10" fill="#0B0E18" opacity=".78"/><text x="14" y="39" class="body"><tspan fill="#40E6FF">YOU</tspan>  eliminated  RUBYHOOK</text>
    <rect y="60" width="266" height="36" rx="10" fill="#0B0E18" opacity=".62"/><text x="14" y="83" class="body">VIOLET  eliminated  NOVA</text>
  </g>

  <g transform="translate(720 450)">
    <circle r="12" fill="none" stroke="#F5F8FF" stroke-opacity=".8"/><circle r="2.5" fill="#40E6FF"/>
    <line x1="-25" y1="0" x2="-14" y2="0" stroke="#F5F8FF"/><line x1="14" y1="0" x2="25" y2="0" stroke="#F5F8FF"/>
    <line x1="0" y1="-25" x2="0" y2="-14" stroke="#F5F8FF"/><line x1="0" y1="14" x2="0" y2="25" stroke="#F5F8FF"/>
  </g>

  <g transform="translate(548 558)">
    <rect width="344" height="64" rx="18" fill="#0B0E18" opacity=".82" stroke="#526996"/>
    <g transform="translate(10 8)"><rect width="74" height="48" rx="12" fill="#121726" stroke="#70FF97"/><text x="37" y="22" text-anchor="middle" class="tiny">Q / DASH</text><text x="37" y="39" text-anchor="middle" class="tiny" fill="#70FF97">READY</text></g>
    <g transform="translate(92 8)"><rect width="74" height="48" rx="12" fill="#121726" stroke="#40E6FF"/><text x="37" y="22" text-anchor="middle" class="tiny">C / SLIDE</text><text x="37" y="39" text-anchor="middle" class="tiny" fill="#70FF97">READY</text></g>
    <g transform="translate(174 8)"><rect width="74" height="48" rx="12" fill="#121726" stroke="#9A65FF"/><text x="37" y="22" text-anchor="middle" class="tiny">F / HOOK</text><text x="37" y="39" text-anchor="middle" class="tiny">1.8s</text></g>
    <g transform="translate(256 8)"><rect width="74" height="48" rx="12" fill="#121726" stroke="#FF56AE"/><text x="37" y="22" text-anchor="middle" class="tiny">G / PARRY</text><text x="37" y="39" text-anchor="middle" class="tiny" fill="#70FF97">READY</text></g>
  </g>

  <g transform="translate(24 786)">
    <rect width="304" height="88" rx="20" class="panel"/>
    <text x="20" y="30" class="tiny" fill="#FF525C">LOW HEALTH</text>
    <text x="20" y="62" class="title">HP  24</text>
    <rect x="98" y="48" width="182" height="14" rx="7" fill="#06080E"/><rect x="98" y="48" width="44" height="14" rx="7" fill="#FF525C"/>
  </g>

  <g transform="translate(1112 786)">
    <rect width="304" height="88" rx="20" class="panel"/>
    <text x="20" y="30" class="tiny" fill="#FFD854">RELOADING</text>
    <text x="20" y="62" class="title">RLD  1.2s</text>
    <g transform="translate(142 42)" fill="#526996">
      <rect width="12" height="30" rx="4"/><rect x="20" width="12" height="30" rx="4"/><rect x="40" width="12" height="30" rx="4"/><rect x="60" width="12" height="30" rx="4"/><rect x="80" width="12" height="30" rx="4"/><rect x="100" width="12" height="30" rx="4"/><rect x="120" width="12" height="30" rx="4"/>
    </g>
  </g>

  <g transform="translate(24 22)">
    <rect width="236" height="48" rx="16" fill="#0B0E18" opacity=".82" stroke="#526996"/>
    <text x="20" y="30" class="tiny">TAB  SCOREBOARD</text>
    <rect x="248" width="236" height="48" rx="16" fill="#0B0E18" opacity=".82" stroke="#526996"/>
    <text x="268" y="30" class="tiny">M  PROGRESSION HUB</text>
  </g>
</svg>
