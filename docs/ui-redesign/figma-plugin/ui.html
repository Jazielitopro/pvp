    <h1>PARRYHOOK UI REDESIGN</h1>
    <p>
      This local importer contains the reviewed starter boards. It creates six
      pages and replaces only its previous imported nodes when rerun.
    </p>

      </div>

      const boardList = document.getElementById("boards");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      const importButton = document.getElementById("import");
      let importStarted = false;

      function renderSelection() {
        boardList.innerHTML = "";
        for (const file of embeddedFiles) {
          const item = document.createElement("li");
          item.textContent = `READY  ${file.name}`;
          boardList.appendChild(item);
        }
        count.textContent = `${embeddedFiles.length} embedded SVG boards ready.`;
      }

      function importBoards() {
        if (importStarted) return;
        importStarted = true;
        importButton.disabled = true;
        status.textContent = "Importing SVG boards...";
        parent.postMessage({ pluginMessage: { type: "import-svgs", files: embeddedFiles } }, "*");
      }

      importButton.addEventListener("click", () => {
        importStarted = false;
        importBoards();
      });

      document.getElementById("cancel").addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        status.textContent = message.message || "";
        importButton.disabled = false;
        if (message.type === "error") importStarted = false;
      };

      renderSelection();
      window.setTimeout(importBoards, 100);
    </script>
