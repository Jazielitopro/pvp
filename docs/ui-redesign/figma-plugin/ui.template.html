<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parryhook UI Redesign Importer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
        background: #06080e;
        color: #f5f8ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #06080e; }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: .8px; }
      p { margin: 0 0 16px; color: #9eacc6; font-size: 13px; line-height: 1.5; }
      .panel { padding: 16px; border: 1px solid #526996; border-radius: 14px; background: #121726; }
      ul { min-height: 230px; margin: 14px 0; padding-left: 20px; color: #70ff97; font-size: 12px; line-height: 1.55; }
      .status { min-height: 20px; color: #ffd854; font-size: 12px; }
      .buttons { display: flex; gap: 10px; margin-top: 16px; }
      button {
        flex: 1;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: #40e6ff;
        color: #06080e;
        cursor: pointer;
        font-weight: 800;
      }
      button.secondary { background: #1d243a; color: #f5f8ff; }
      button:disabled { cursor: not-allowed; opacity: .45; }
    </style>
  </head>
  <body>
    <h1>PARRYHOOK UI REDESIGN</h1>
    <p>
      This local importer contains the reviewed starter boards. It creates six
      pages and replaces only its previous imported nodes when rerun.
    </p>
    <div class="panel">
      <div id="count" class="status"></div>
      <ul id="boards"></ul>
      <div id="status" class="status">Preparing automatic import...</div>
      <div class="buttons">
        <button id="import">IMPORT AGAIN</button>
        <button id="cancel" class="secondary">CLOSE</button>
      </div>
    </div>

    <script>
      const embeddedFiles = __PARRYHOOK_BOARDS__;
      const boardList = document.getElementById("boards");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      const importButton = document.getElementById("import");
      let importStarted = false;

      function renderSelection() {
        boardList.innerHTML = "";
        for (const file of embeddedFiles) {
          const item = document.createElement("li");
          item.textContent = `READY  ${file.name}`;
          boardList.appendChild(item);
        }
        count.textContent = `${embeddedFiles.length} embedded SVG boards ready.`;
      }

      function importBoards() {
        if (importStarted) return;
        importStarted = true;
        importButton.disabled = true;
        status.textContent = "Importing SVG boards...";
        parent.postMessage({ pluginMessage: { type: "import-svgs", files: embeddedFiles } }, "*");
      }

      importButton.addEventListener("click", () => {
        importStarted = false;
        importBoards();
      });

      document.getElementById("cancel").addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        status.textContent = message.message || "";
        importButton.disabled = false;
        if (message.type === "error") importStarted = false;
      };

      renderSelection();
      window.setTimeout(importBoards, 100);
    </script>
  </body>
</html>
